mode: auto     # debug下会指定车辆，在运动中一直构造AABB和边值的Rviz可视化，auto下只有出现死锁才会进行构造
# Execute the validated NLP recovery trajectory in simulation.
execute_after_solve: true

vehicle_ids: [0, 1]
snapshot_topic: /forklift_planner/recovery_snapshot
debug_output_file: /tmp/forklift_nlp_recovery_input.yaml
results_dir: package://forklift_nlp_recovery/results
initial_guess_nodes: 51
initial_guess_time_margin: 1.2

# CasADi + IPOPT solve and independent continuous validation.
solver_min_time_scale: 0.5
solver_max_time_scale: 4.0
solver_time_weight: 1.0
solver_acceleration_weight: 1.0
solver_steer_rate_weight: 5.0
solver_control_smooth_weight: 5.0
# Soft cost only: stopping has zero cost, motion opposite to the frozen path
# direction is penalized smoothly. Acceleration/control smoothing already
# discourages rapid changes, so no separate speed-switch cost is added.
solver_reference_direction_weight: 5.0
solver_direction_smoothing_speed: 0.02
solver_direction_switch_speed_threshold: 0.01
solver_max_iterations: 1000
solver_tolerance: 1.0e-6
solver_acceptable_tolerance: 1.0e-4
solver_print_level: 3
solver_validation_substeps: 10
solver_validation_tolerance: 1.0e-3

# A positive override is used directly. Values <= 0 use hypot(length/2, width/2).
vehicle_radius: 0.15
safety_margin: 0.0
shelf_inflation_reduction: 0.05
boundary_inset_reduction: 0.05
expansion_step: 0.02
seed_search_step: 0.01
seed_search_max_offset: 0.10
rejoin_distance: 0.80
max_width: 2.50
max_height: 2.00
